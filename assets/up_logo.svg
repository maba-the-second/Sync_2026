<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <filter id="upglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Futuristic tech badge for Dharmaraja College ICT Society -->
  <polygon points="10,40 25,10 215,10 230,40 215,70 25,70" stroke="#5CE3D2" stroke-width="1.5" fill="#07100B" fill-opacity="0.9" />
  <polygon points="18,40 28,18 202,18 212,40 202,62 28,62" stroke="#5CE3D2" stroke-width="0.75" stroke-opacity="0.5" stroke-dasharray="4 3" fill="none" />
  
  <!-- DRCK ICT Crest Node -->
  <polygon points="36,40 45,26 55,40 45,54" fill="#5CE3D2" filter="url(#upglow)" />
  <circle cx="45" cy="40" r="3" fill="#07100B" />
  
  <text x="68" y="34" font-family="'Orbitron', sans-serif" font-weight="800" font-size="12" fill="#E1F3F7" letter-spacing="2">DHARMARAJA</text>
  <text x="68" y="52" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#5CE3D2" letter-spacing="3">ICT SOCIETY • 2026</text>
  
  <circle cx="218" cy="40" r="2.5" fill="#5CE3D2" filter="url(#upglow)" />
</svg>