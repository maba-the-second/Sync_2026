<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CE3D2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07100B" stop-opacity="0.8" />
    </linearGradient>
    <filter id="lglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Perspective Arena Grid lines -->
  <line x1="50" y1="280" x2="250" y2="180" stroke="#5CE3D2" stroke-opacity="0.2" />
  <line x1="150" y1="280" x2="270" y2="180" stroke="#5CE3D2" stroke-opacity="0.2" />
  <line x1="300" y1="280" x2="300" y2="180" stroke="#5CE3D2" stroke-opacity="0.4" />
  <line x1="450" y1="280" x2="330" y2="180" stroke="#5CE3D2" stroke-opacity="0.2" />
  <line x1="550" y1="280" x2="350" y2="180" stroke="#5CE3D2" stroke-opacity="0.2" />

  <!-- Podium 2 (Left) -->
  <polygon points="120,230 200,210 200,270 120,285" fill="#0B7772" fill-opacity="0.3" stroke="#5CE3D2" stroke-width="1.5" />
  <polygon points="120,230 200,210 240,225 160,245" fill="url(#lbg)" stroke="#5CE3D2" stroke-width="1" />
  <text x="160" y="270" font-family="'Orbitron', sans-serif" font-weight="900" font-size="20" fill="#8AB3B9" text-anchor="middle">#2</text>

  <!-- Podium 1 (Center - Highest) -->
  <polygon points="250,180 350,180 350,265 250,265" fill="#0B7772" fill-opacity="0.35" stroke="#29CEAF" stroke-width="2.5" filter="url(#lglow)" />
  <polygon points="250,180 300,150 400,150 350,180" fill="url(#lbg)" stroke="#29CEAF" stroke-width="1.5" />
  <polygon points="350,180 400,150 400,235 350,265" fill="#07100B" stroke="#5CE3D2" stroke-width="1" />
  <text x="300" y="235" font-family="'Orbitron', sans-serif" font-weight="900" font-size="32" fill="#5CE3D2" text-anchor="middle" filter="url(#lglow)">#1</text>
  <circle cx="300" cy="115" r="14" fill="#5CE3D2" filter="url(#lglow)" />
  <polygon points="300,95 308,110 325,112 312,123 316,140 300,131 284,140 288,123 275,112 292,110" fill="#07100B" />

  <!-- Podium 3 (Right) -->
  <polygon points="410,240 480,225 480,275 410,288" fill="#0B7772" fill-opacity="0.3" stroke="#5CE3D2" stroke-width="1.5" />
  <polygon points="410,240 480,225 510,235 440,250" fill="url(#lbg)" stroke="#5CE3D2" stroke-width="1" />
  <text x="445" y="276" font-family="'Orbitron', sans-serif" font-weight="900" font-size="18" fill="#8AB3B9" text-anchor="middle">#3</text>
</svg>